; Volumetric fog: exponential height fog lit by the sun (shadowed by the sun shadow cascades) and the sky's ambient
; light, composited in linear light over the world: scene * transmittance + light scattered toward the camera.
; Outdoors only. Includes the sun's light scattered in the fog, so it replaces Sun shafts (turn that off with it).
; An fnv_vk effect: this manifest plus GLSL passes, compiled when the game starts (format: docs/EFFECTS.md).

[Effect]
Name=Volumetric fog
Description=Height fog that thickens toward the ground, lit by the sun (with light shafts where shadows cross it) and the sky. Outdoors only. Includes sun shafts: turn Sun shafts off with it.
Point=world
Order=105
SceneColor=1
; No fog indoors, with the camera under water, or at density 0 (upsample.frag: transmittance 1, no light).
Skip=interior,underwater,density=0

; Extinction at the base height, per 10,000 game units (about 140 m): 1 lets e^-1 of the light through over that.
[Param.density]
Label=Density
Type=float
Default=0.5
Min=0
Max=10

[Param.falloff]
Label=Height falloff (game units per e-fold)
Type=float
Default=1500
Min=100
Max=20000

[Param.baseHeight]
Label=Base height relative to the camera
Type=float
Default=0
Min=-10000
Max=10000

[Param.sun]
Label=Sunlight
Type=float
Default=1
Min=0
Max=4

[Param.ambient]
Label=Sky light
Type=float
Default=1
Min=0
Max=4

[Param.anisotropy]
Label=Forward scattering
Type=float
Default=0.6
Min=0
Max=0.95

[Param.range]
Label=Range over the sky (game units)
Type=float
Default=100000
Min=10000
Max=400000

[Param.steps]
Label=Shadow steps
Type=int
Default=24
Min=4
Max=96

; Half resolution: r the sun's in-scattered light (phase and pi included, without the sun's colour), g the pixel's view
; distance (for the upsampling).
[Image.scatter]
Format=rg16f
Scale=0.5

; Full resolution: r the sun's in-scattered light (upsampled), g the transmittance to the pixel (exact).
[Image.full]
Format=rg16f
Scale=1

[Pass.0]
Shader=march.frag
Output=scatter

[Pass.1]
Shader=upsample.frag
Output=full

; A scene pass: no depth; composites from the image and the scene colour.
[Pass.2]
Shader=apply.frag
Output=scene
Blend=none
