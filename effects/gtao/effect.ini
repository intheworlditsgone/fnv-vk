; Ground-truth ambient occlusion (Jimenez et al. 2016, structure as in Intel's XeGTAO).
; An fnv_vk effect: this manifest plus GLSL passes, compiled when the game starts (format: docs/EFFECTS.md).

[Effect]
Name=GTAO
Description=Ground-truth ambient occlusion: contact shadowing in corners, creases and under objects. With the lighting's physically based mode, the lighting applies it to the ambient light and reflections only.
Point=world
Order=100

[Param.radius]
Label=Radius (game units)
Type=float
Default=64
Min=8
Max=256

[Param.intensity]
Label=Intensity
Type=float
Default=1.0
Min=0.25
Max=3.0

[Param.slices]
Label=Slices
Type=int
Default=3
Min=1
Max=8

[Param.steps]
Label=Steps per side
Type=int
Default=6
Min=1
Max=16

[Param.fadeStart]
Label=Fade start (distance)
Type=float
Default=3000
Min=0
Max=20000

[Param.fadeEnd]
Label=Fade end (distance)
Type=float
Default=6000
Min=1
Max=30000

; Computed and denoised at half resolution (gtao.frag, blur.frag: a quarter of the pixels), then brought to every pixel
; by a depth-aware upsample (upsample.frag).
[Image.raw]
Format=r8
Scale=0.5

[Image.half]
Format=rg16f
Scale=0.5

; The denoised visibility (r) with log2 of the view distance it is for (g), at full resolution, published as the frame's
; ambient occlusion: with the lighting's physically based mode on, the lighting applies it to the ambient light and
; reflections only (in the next frame, reprojected and validated by g; docs/SHADER_ABI.md "Ambient occlusion") and the
; apply pass leaves the image as it is. The screen-space indirect light is its own effect (effects/ssgi).
[Image.blurred]
Format=rg16f
Publish=ao

[Pass.0]
Shader=gtao.frag
Output=raw

[Pass.1]
Shader=blur.frag
Output=half

[Pass.2]
Shader=upsample.frag
Output=blurred

[Pass.3]
Shader=apply.frag
Output=scene
Blend=multiply
; The physically based lighting applies the published AO itself (this pass would multiply by 1).
Skip=pbr
