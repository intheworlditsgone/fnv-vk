; Depth of field: a thin lens's circle of confusion from each pixel's distance, blurred by scatter-as-gather at half
; resolution with separate far and near layers (Jimenez, "Next Generation Post Processing in Call of Duty: Advanced
; Warfare", SIGGRAPH 2014; the approach of Otis_Inf's CinematicDOF, which Community Shaders' depth of field builds on).
;
; The lens: a 36 mm wide sensor over the camera's view, its focal length by default the one that gives the game's
; field of view (so zooming in, iron sights and scopes, narrows the depth of field as a real lens would), aperture
; diameter focal length / f-number. Distances in game units, 64 per yard (1.42875 cm each).
;
; It runs at "world", after the world and before the first-person view (arms, weapon, Pip-Boy), which therefore stays
; sharp and does not take the focus; autofocus measures the world at the centre of the view.
[Effect]
Name=Depth of field
Description=Lens blur away from the focus distance (autofocus at the centre of the view, or a fixed distance). The first-person view stays sharp.
Point=world
Order=190
SceneColor=1
Enable=0

[Param.fNumber]
Label=Aperture (f-number)
Type=float
Default=2
Min=1
Max=22

[Param.focalLength]
Label=Focal length (mm; 0: from the game's field of view)
Type=float
Default=0
Min=0
Max=300

[Param.autofocus]
Label=Autofocus
Type=bool
Default=1

[Param.focusDistance]
Label=Focus distance without autofocus (m)
Type=float
Default=10
Min=0.3
Max=200

[Param.focusArea]
Label=Autofocus area (% of the image height)
Type=float
Default=4
Min=0.5
Max=30

[Param.focusSpeed]
Label=Autofocus speed (1/s)
Type=float
Default=5
Min=0.2
Max=30

[Param.maxBlur]
Label=Largest blur radius (% of the image height)
Type=float
Default=1.5
Min=0.2
Max=4

[Param.nearBlur]
Label=Blur in front of the focus
Type=bool
Default=1

[Param.samples]
Label=Samples
Type=int
Default=48
Min=16
Max=96

; The focus distance (game units), adapted over time; focusprev keeps the previous run's.
[Image.focus]
Format=r32f
Size=1x1

[Image.focusprev]
Format=r32f
Size=1x1

; Full resolution: the signed blur radius (full-resolution pixels; negative in front of the focus).
[Image.coc]
Format=r16f
Scale=1

; Half resolution: the colour in linear light, and the signed blur radius.
[Image.half]
Format=rgba16f
Scale=0.5

; Per 16 x 16 pixels: the largest blur radius in front of the focus; dilated: of every tile it can reach this one from.
[Image.tiles]
Format=r16f
Scale=0.0625

[Image.near]
Format=r16f
Scale=0.0625

; Half resolution: the far layer (the background's blur), and the near layer (colour, coverage).
[Image.farblur]
Format=rgba16f
Scale=0.5

[Image.nearblur]
Format=rgba16f
Scale=0.5

[Pass.0]
Shader=focus.frag
Output=focus

[Pass.1]
Shader=focuscopy.frag
Output=focusprev

[Pass.2]
Shader=coc.frag
Output=coc

[Pass.3]
Shader=prefilter.frag
Output=half

[Pass.4]
Shader=tiles.frag
Output=tiles

[Pass.5]
Shader=dilate.frag
Output=near

[Pass.6]
Shader=far.frag
Output=farblur

[Pass.7]
Shader=near.frag
Output=nearblur

[Pass.8]
Shader=composite.frag
Output=scene
Blend=none
