; Subsurface scattering: light that enters skin spreads under it before it leaves, softening the skin's shading and
; tinting its shadow edges red. A screen-space blur of the skin's light (Jimenez et al. 2015, "Separable Subsurface
; Scattering"), ported from Community Shaders' Subsurface Scattering (GPL-3.0) with its human profile. The skin comes
; from the lighting (physically based mode): its skin shaders mark their pixels and albedo (docs/SKIN.md).
; An fnv_vk effect: this manifest plus GLSL passes, compiled when the game starts (format: docs/EFFECTS.md).

[Effect]
Name=Subsurface scattering
Description=Soft, translucent skin: the skin's light spreads under its surface (needs Lighting: Physically based lighting).
Point=opaque
Order=50
SceneColor=1
Requires=pbr
SkinBuffer=1

; The blur's width (Community Shaders' Blur Radius): 1 spreads the light over about 3 game units at 1 unit's distance
; from the camera's projection plane, scaled by distance.
[Param.radius]
Label=Blur radius
Type=float
Default=1
Min=0
Max=3

; How sharply a depth step stops the blur (Community Shaders' Thickness): taps over 1 / (thickness x the projection's
; scale) game units in front of or behind the pixel keep the pixel's own light.
[Param.thickness]
Label=Depth falloff
Type=float
Default=1
Min=0
Max=3

[Image.kernel]
Format=rgba16f
Size=21x1

[Image.irr]
Format=rgba16f
Scale=1

[Image.blur]
Format=rgba16f
Scale=1

[Image.final]
Format=rgba16f
Scale=1

[Pass.0]
Shader=kernel.frag
Output=kernel

[Pass.1]
Shader=extract.frag
Output=irr

[Pass.2]
Shader=blurh.frag
Output=blur

[Pass.3]
Shader=apply.frag
Output=final

; The scene pass only composites (a pass writing the scene cannot read the depth).
[Pass.4]
Shader=composite.frag
Output=scene
Blend=alpha
