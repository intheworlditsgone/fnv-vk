; Motion blur: the reconstruction filter of McGuire et al., "A Reconstruction Filter for Plausible Motion Blur" (I3D
; 2012), as Community Shaders' post-processing motion blur uses it (tile maximum, neighbourhood maximum, depth-aware
; gather along the dominant velocity).
;
; Velocities come from the camera's motion: each pixel's surface (from its depth) projected with this run's and the
; previous run's camera (fnvPrevPixel). The game draws no motion vectors, so objects that move by themselves (actors)
; blur with the camera's motion only. It runs at "world", after the world and before the first-person view (arms,
; weapon, Pip-Boy), which therefore stays sharp, and before image space (bloom, HDR), so the blur is in the scene's
; light before the tone curve.
[Effect]
Name=Motion blur
Description=Blur along the camera's motion during the exposure (from depth and the previous frame's camera). The first-person view stays sharp.
Point=world
Order=200
SceneColor=1
Enable=0
Skip=shutter=0

[Param.shutter]
Label=Shutter (fraction of the frame time)
Type=float
Default=0.5
Min=0
Max=1

[Param.maxBlur]
Label=Longest blur (% of the image height)
Type=float
Default=4
Min=0.5
Max=10

[Param.samples]
Label=Samples
Type=int
Default=16
Min=8
Max=32

; A camera that moved farther than this between two runs was cut or teleported (load doors, fast travel, camera
; switches): no blur for that frame.
[Param.cutDistance]
Label=Camera cut beyond (game units per frame)
Type=float
Default=300
Min=50
Max=2000

; Per full-resolution pixel: xy half the blur vector (pixels), z the view distance.
[Image.vel]
Format=rgba16f
Scale=1

; The scene in linear light (filtered bilinearly along the streaks).
[Image.lin]
Format=rgba16f
Scale=1

; Per 16 x 16 pixels: the longest half-vector in the tile, and in the tile's neighbourhood.
[Image.tiles]
Format=rg16f
Scale=0.0625

[Image.neighbor]
Format=rg16f
Scale=0.0625

[Pass.0]
Shader=velocity.frag
Output=vel

[Pass.1]
Shader=linear.frag
Output=lin

[Pass.2]
Shader=tilemax.frag
Output=tiles

[Pass.3]
Shader=neighbormax.frag
Output=neighbor

[Pass.4]
Shader=reconstruct.frag
Output=scene
Blend=none
