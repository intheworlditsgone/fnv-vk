; Sun shafts: sunlight scattered toward the camera by the air, shadowed by the sun shadow cascades, so light falls in
; shafts between trees, through doorways and past buildings. Outdoors in daylight only (no cascades otherwise).
; An fnv_vk effect: this manifest plus GLSL passes, compiled when the game starts (format: docs/EFFECTS.md).

[Effect]
Name=Sun shafts
Description=Volumetric sunlight: light shafts where the sun's light is blocked along the view, brightest toward the sun.
Point=world
Order=110
; Adds no light without cascades (indoors, night, shadows off), with the camera under water, or at intensity 0.
Skip=nocascades,underwater,intensity=0

[Param.intensity]
Label=Intensity
Type=float
Default=0.5
Min=0
Max=4

[Param.density]
Label=Air density
Type=float
Default=1.0
Min=0.1
Max=8

[Param.anisotropy]
Label=Forward scattering
Type=float
Default=0.7
Min=0
Max=0.95

[Param.steps]
Label=Steps
Type=int
Default=32
Min=8
Max=96

[Image.scatter]
Format=rg16f
Scale=0.5

[Image.smooth]
Format=rg16f
Scale=0.5

[Pass.0]
Shader=march.frag
Output=scatter

[Pass.1]
Shader=blur.frag
Output=smooth

[Image.full]
Format=r16f
Scale=1

[Pass.2]
Shader=upsample.frag
Output=full

; A scene pass runs inside the game's render pass, where the depth buffer is attached: it reads only the image.
[Pass.3]
Shader=apply.frag
Output=scene
Blend=add
