; Screen-space indirect light (docs/INDIRECT.md "SSGI"): light bounced from what is on screen, for the lighting's
; physically based mode (which applies it in the next frame, reprojected and validated by its depth; the rays that find
; nothing get the environment probe's ambient). Independent of the ambient occlusion (effects/gtao).
; An fnv_vk effect: this manifest plus GLSL passes, compiled when the game starts (format: docs/EFFECTS.md).

[Effect]
Name=SSGI
Description=Screen-space indirect light: light bounced from nearby surfaces on screen (a red wall tints the floor beside it). Used by the lighting's physically based mode only; does not run without it.
Point=world
Order=90
SceneColor=1
Requires=pbr

[Param.giRadius]
Label=Ray length (game units)
Type=float
Default=600
Min=50
Max=3000

[Param.giRays]
Label=Rays per pixel
Type=int
Default=4
Min=1
Max=16

[Param.giSteps]
Label=Steps per ray
Type=int
Default=10
Min=2
Max=32

[Param.giResponse]
Label=Temporal response (1: no accumulation)
Type=float
Default=0.15
Min=0.02
Max=1

[Param.giFadeEnd]
Label=Range (distance)
Type=float
Default=8000
Min=500
Max=30000

; At half resolution: rgb the light the rays found on screen (irradiance / pi), a the fraction of rays that found
; nothing; denoised in space and time.
[Image.giraw]
Format=rgba16f
Scale=0.5

[Image.gi]
Format=rgba16f
Scale=0.5
Publish=gi

; The previous frame's indirect light (gitemporal.frag's history).
[Image.gihist]
Format=rgba16f
Scale=0.5

; log2 of the view distance each texel of gi is for: validates its history (gitemporal.frag reads the previous frame's,
; before gidepth.frag writes this frame's) and, published, the lighting's reprojection of it.
[Image.gidepth]
Format=r16f
Scale=0.5
Publish=gidepth

[Pass.0]
Shader=ssgi.frag
Output=giraw

[Pass.1]
Shader=gitemporal.frag
Output=gi

[Pass.2]
Shader=gicopy.frag
Output=gihist

[Pass.3]
Shader=gidepth.frag
Output=gidepth
