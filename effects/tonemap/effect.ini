[Effect]
Name=Tonemapping
Description=Tone curve over the game's HDR image (the game only clips it). With HDR output, highlights extend to the display's peak brightness.
Point=tonemap
Order=100
SceneColor=1

[Param.op]
Label=Operator
Type=enum
Options=Vanilla (clip),Reinhard,Reinhard (extended),ACES (Narkowicz),ACES Filmic (Hill),AgX,AgX Punchy,Uncharted 2 (Hable),Uchimura (Gran Turismo),Lottes
Default=0

[Param.exposure]
Label=Exposure (EV)
Type=float
Default=0
Min=-3
Max=3

[Param.contrast]
Label=Contrast
Type=float
Default=1
Min=0.5
Max=2

[Param.saturation]
Label=Saturation
Type=float
Default=1
Min=0
Max=2

[Param.white]
Label=White point (Reinhard extended)
Type=float
Default=4
Min=1
Max=16

[Param.knee]
Label=HDR: highlights extend from
Type=float
Default=0.5
Min=0.1
Max=0.9

; Auto-exposure (docs/HDR.md "Auto-exposure"): the image's log-average luminance, adapted over time, scaled to the
; target before the tone curve. The game's own HDR pass has already adapted the image to the scene; this is a second,
; slower correction toward a brightness that suits the tone curve, within the range below.
[Param.autoExposure]
Label=Auto-exposure
Type=bool
Default=0

[Param.aeTarget]
Label=Auto-exposure: target (EV from mid grey)
Type=float
Default=0
Min=-2
Max=2

[Param.aeMin]
Label=Auto-exposure: most darkening (EV)
Type=float
Default=-2
Min=-6
Max=0

[Param.aeMax]
Label=Auto-exposure: most brightening (EV)
Type=float
Default=2
Min=0
Max=6

[Param.aeSpeedUp]
Label=Auto-exposure: speed toward brighter scenes (1/s)
Type=float
Default=2
Min=0.1
Max=10

[Param.aeSpeedDown]
Label=Auto-exposure: speed toward darker scenes (1/s)
Type=float
Default=0.7
Min=0.1
Max=10

[Param.aeCentre]
Label=Auto-exposure: centre weighting
Type=float
Default=0.5
Min=0
Max=1

; Interiors (the player is in an interior cell, fnv.shadowInfo.z): with "Interiors: own settings" on, the parameters below
; replace the ones above of the same meaning there; outdoors, and with it off, they are unused. The HDR knee, the
; auto-exposure speeds and its centre weighting are shared (the metered luminance carries over a cell change).
[Param.interior]
Label=Interiors: own settings
Type=bool
Default=0

[Param.iOp]
Label=Interiors: operator
Type=enum
Options=Vanilla (clip),Reinhard,Reinhard (extended),ACES (Narkowicz),ACES Filmic (Hill),AgX,AgX Punchy,Uncharted 2 (Hable),Uchimura (Gran Turismo),Lottes
Default=0

[Param.iExposure]
Label=Interiors: exposure (EV)
Type=float
Default=0
Min=-3
Max=3

[Param.iContrast]
Label=Interiors: contrast
Type=float
Default=1
Min=0.5
Max=2

[Param.iSaturation]
Label=Interiors: saturation
Type=float
Default=1
Min=0
Max=2

[Param.iWhite]
Label=Interiors: white point (Reinhard extended)
Type=float
Default=4
Min=1
Max=16

[Param.iAutoExposure]
Label=Interiors: auto-exposure
Type=bool
Default=0

[Param.iAeTarget]
Label=Interiors: auto-exposure target (EV from mid grey)
Type=float
Default=0
Min=-2
Max=2

[Param.iAeMin]
Label=Interiors: auto-exposure most darkening (EV)
Type=float
Default=-2
Min=-6
Max=0

[Param.iAeMax]
Label=Interiors: auto-exposure most brightening (EV)
Type=float
Default=2
Min=0
Max=6

; log2 luminance, one texel per 16 x 16 pixels.
[Image.aelum]
Format=r16f
Scale=0.0625

; 16 x 16 blocks of it: weighted mean log2 luminance, sum of weights.
[Image.aeblocks]
Format=rg16f
Size=16x16

; The adapted log2 luminance; aeprev keeps the previous frame's. 32-bit: each frame moves it by about 1% of the way,
; less than a half float can resolve near the target.
[Image.aeadapt]
Format=r32f
Size=1x1

[Image.aeprev]
Format=r32f
Size=1x1

[Pass.0]
Shader=aelum.frag
Output=aelum

[Pass.1]
Shader=aereduce.frag
Output=aeblocks

[Pass.2]
Shader=aeadapt.frag
Output=aeadapt

[Pass.3]
Shader=aecopy.frag
Output=aeprev

[Pass.4]
Shader=tonemap.frag
Output=scene
Blend=none
