; Realistic water: replaces the game's water surface shaders (WaterShader::LoadShaders 0x00B827C0 variant table).
; Each [Shader.WATERnnn.pso] is water.frag with that variant's features. Not replaced: WATER016 (seen from under
; the water), WATER035 (stencil), WATER036/037 (point-light passes).
[Replacement]
Name=Water
Description=Physically based water: exact Fresnel, Beer-Lambert absorption and scattering by depth, GGX sun highlight, multi-scale waves. Uses each water type's own colours and settings. Enabling or disabling applies at the next start.

